<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0017"/>
      <stop offset="100%" stop-color="#1a003a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#863bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#863bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#47bfff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#47bfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="280" cy="260" rx="320" ry="260" fill="#863bff" opacity="0.18" filter="url(#blur-lg)"/>
  <ellipse cx="960" cy="380" rx="280" ry="220" fill="#47bfff" opacity="0.13" filter="url(#blur-lg)"/>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" ry="24" fill="none" stroke="#863bff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Logo icon (lightning bolt shape, scaled from favicon) -->
  <g transform="translate(420, 175) scale(3.8)">
    <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
    <!-- Cyan highlight streak -->
    <path fill="#47bfff" opacity="0.7" d="M41.412 6.333 c-2 3-6 9-10 15 h8 z"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="96" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">Sniplink</text>

  <!-- Tagline -->
  <text x="600" y="358" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="400" fill="#c4a8ff" text-anchor="middle" letter-spacing="0.5">Short Links, Big Impact</text>

  <!-- Pill badge -->
  <rect x="481" y="400" width="238" height="48" rx="24" fill="#863bff" opacity="0.18"/>
  <rect x="481" y="400" width="238" height="48" rx="24" fill="none" stroke="#863bff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="600" y="432" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#c4a8ff" text-anchor="middle">sniplink-web.vercel.app</text>
</svg>
